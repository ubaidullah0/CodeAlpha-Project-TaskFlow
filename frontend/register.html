<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        TaskFlow
      </div>
      <h2 style="text-align: center; margin-bottom: 0.5rem; font-weight: 700; color: var(--text-main);">Create your account</h2>
      <p style="text-align: center; margin-bottom: 2rem; color: var(--text-muted); font-size: 0.95rem;">Join your team and start managing projects.</p>
      
      <div id="error-msg" class="alert alert-error hidden"></div>
      
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input class="form-control" type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-control" type="email" id="email" placeholder="name@company.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input class="form-control" type="password" id="password" placeholder="••••••••" required>
            <div class="pwd-toggle" onclick="togglePassword('password', 'eye-pwd', event)">
              <svg id="eye-pwd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
          </div>
          <p class="text-muted" style="font-size: 0.75rem; margin-top: 0.25rem;">Min. 8 characters, 1 uppercase, 1 lowercase, 1 number</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <input class="form-control" type="password" id="confirm-password" placeholder="••••••••" required>
            <div class="pwd-toggle" onclick="togglePassword('confirm-password', 'eye-pwd-confirm', event)">
              <svg id="eye-pwd-confirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="register-btn" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">Create Account</button>
      </form>
      
      <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem;" class="text-muted">
        Already have an account? <a href="login.html" style="font-weight: 600;">Log in</a>
      </p>
    </div>
  </div>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script>
</body>
</html>
