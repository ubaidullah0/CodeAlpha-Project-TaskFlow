<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        TaskFlow
      </div>
      <h2 style="text-align: center; margin-bottom: 0.5rem; font-weight: 700; color: var(--text-main);">Create a New Password</h2>
      <p style="text-align: center; margin-bottom: 2rem; color: var(--text-muted); font-size: 0.95rem;">Enter your new password below.</p>
      
      <div id="error-msg" class="alert alert-error hidden"></div>
      
      <form id="reset-password-form">
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <div class="input-wrap">
            <input class="form-control" type="password" id="new-password" placeholder="••••••••" required>
            <div class="pwd-toggle" onclick="togglePassword('new-password', 'eye-pwd-new')">
              <svg id="eye-pwd-new" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
          </div>
          <p class="text-muted" style="font-size: 0.75rem; margin-top: 0.25rem;">Min. 8 characters, 1 uppercase, 1 lowercase, 1 number</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-new-password">Confirm New Password</label>
          <div class="input-wrap">
            <input class="form-control" type="password" id="confirm-new-password" placeholder="••••••••" required>
            <div class="pwd-toggle" onclick="togglePassword('confirm-new-password', 'eye-pwd-confirm-new')">
              <svg id="eye-pwd-confirm-new" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="reset-btn" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Reset Password</button>
      </form>
    </div>
  </div>
  
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
