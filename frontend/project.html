<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Board - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="nav-brand" style="justify-content: flex-start; margin-bottom: 2rem;">`n        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>`n        TaskFlow`n      </div>
      <ul style="margin-top: 2rem;">
        <li style="margin-bottom: 1rem;"><a href="dashboard.html">Dashboard</a></li>
      </ul>
      
      <div style="margin-top: 2rem;">
        <h4 style="margin-bottom: 0.5rem;">Team Members</h4>
        <ul id="team-members-list" style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">
          <!-- Members loaded here -->
        </ul>
        <button class="btn btn-secondary btn-sm" style="width: 100%; font-size: 0.75rem;" onclick="document.getElementById('add-member-modal').classList.remove('hidden')">
          + Add Member
        </button>
      </div>

      <div style="margin-top: auto;">
        <p id="user-name" class="text-muted" style="margin-bottom: 0.5rem;"></p>
        <button onclick="logout()" class="btn btn-secondary" style="width: 100%;">Log Out</button>
      </div>
    </aside>
    
    <main class="main-content">
      <header class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="project-title">Loading Project...</h3>
        <div style="display: flex; align-items: center; gap: 1.5rem;">
          <div id="realtime-status" style="font-size: 0.875rem; color: #10b981; display: flex; align-items: center; gap: 0.5rem;">
            <div id="realtime-dot" style="width: 8px; height: 8px; background-color: #10b981; border-radius: 50%;"></div>
            <span id="realtime-text">Live</span>
          </div>
          <div style="position: relative;">
            <button id="notif-btn" class="btn btn-secondary btn-sm" style="position: relative; padding: 0.5rem;">
              🔔 <span id="notif-badge" class="badge hidden" style="position: absolute; top: -8px; right: -8px; background: #ef4444; color: white;">0</span>
            </button>
            <div id="notif-dropdown" class="dropdown hidden" style="position: absolute; right: 0; top: 100%; margin-top: 0.5rem; width: 320px; background: white; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 1000; max-height: 400px; overflow-y: auto;">
              <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <strong>Notifications</strong>
                <button id="mark-all-read" class="btn btn-sm" style="font-size: 0.75rem;">Mark all read</button>
              </div>
              <div id="notif-list">
                <p style="padding: 1rem; text-align: center;" class="text-muted">Loading...</p>
              </div>
            </div>
          </div>
        </div>
      </header>
      
      <div class="content-area" style="display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <p id="project-desc" class="text-muted"></p>
          <button class="btn btn-primary" onclick="openCreateTaskModal()">+ Add Task</button>
        </div>
        
        <div id="board-container" class="board-container">
          <!-- Columns loaded here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Add Member Modal -->
  <div id="add-member-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3>Add Team Member</h3>
        <button class="btn btn-secondary" onclick="document.getElementById('add-member-modal').classList.add('hidden')">X</button>
      </div>
      <form id="add-member-form">
        <div class="form-group">
          <label class="form-label" for="member-email">User Email</label>
          <input class="form-control" type="email" id="member-email" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('add-member-modal').classList.add('hidden')">Cancel</button>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Modal (Create/Edit/View) -->
  <div id="task-modal" class="modal-backdrop hidden">
    <div class="modal-content" style="max-width: 600px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3 id="task-modal-title">Create Task</h3>
        <button class="btn btn-secondary" onclick="closeTaskModal()">X</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label class="form-label" for="task-title-input">Title</label>
          <input class="form-control" type="text" id="task-title-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="task-desc-input">Description</label>
          <textarea class="form-control" id="task-desc-input" rows="3"></textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="task-column-select">Column</label>
            <select class="form-control" id="task-column-select" required></select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="task-priority">Priority</label>
            <select class="form-control" id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="task-assignee">Assignee</label>
          <select class="form-control" id="task-assignee">
            <option value="">Unassigned</option>
            <!-- Filled dynamically -->
          </select>
        </div>
        
        <div style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
          <button type="button" class="btn btn-danger hidden" id="delete-task-btn" onclick="deleteTask()">Delete Task</button>
          <div style="display: flex; gap: 1rem; margin-left: auto;">
            <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-task-btn">Save</button>
          </div>
        </div>
      </form>

      <!-- Comments Section (only visible when viewing a task) -->
      <div id="comments-section" class="hidden" style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
        <h4>Comments</h4>
        <div id="comments-list" style="margin-top: 1rem; max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
          <!-- Comments go here -->
        </div>
        <form id="add-comment-form" style="margin-top: 1rem; display: flex; gap: 0.5rem;">
          <input type="text" id="comment-input" class="form-control" placeholder="Write a comment..." required>
          <button type="submit" class="btn btn-primary">Post</button>
        </form>
      </div>

    </div>
  </div>

  <!-- Notifications Panel -->
  <div id="notifications-panel" class="hidden" style="position: absolute; top: 60px; right: 2rem; width: 300px; background: var(--card-bg); box-shadow: var(--shadow-md); border-radius: var(--radius); z-index: 100; border: 1px solid var(--border-color); max-height: 400px; overflow-y: auto;">
    <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600;">Notifications</div>
    <div id="notifications-list">
      <!-- Notifications go here -->
    </div>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
