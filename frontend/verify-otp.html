<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        TaskFlow
      </div>
      <h2 style="text-align: center; margin-bottom: 0.5rem; font-weight: 700; color: var(--text-main);">Verify your email</h2>
      <p style="text-align: center; margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.95rem;">
        We sent a 6-digit code to <br><strong id="otp-email-display">your email</strong>
      </p>
      
      <div id="error-msg" class="alert alert-error hidden"></div>
      
      <form id="verify-otp-form">
        <div class="otp-container" id="otp-inputs">
          <input type="text" class="otp-input" maxlength="1" required autocomplete="off">
          <input type="text" class="otp-input" maxlength="1" required autocomplete="off">
          <input type="text" class="otp-input" maxlength="1" required autocomplete="off">
          <input type="text" class="otp-input" maxlength="1" required autocomplete="off">
          <input type="text" class="otp-input" maxlength="1" required autocomplete="off">
          <input type="text" class="otp-input" maxlength="1" required autocomplete="off">
        </div>
        
        <p style="text-align: center; font-size: 0.85rem; color: #dc2626; margin-bottom: 1rem; font-weight: 500;" id="otp-timer">
          OTP expires in 02:00
        </p>

        <button type="submit" class="btn btn-primary" id="verify-btn" style="width: 100%; padding: 0.75rem;">Verify OTP</button>
      </form>
      
      <div style="text-align: center; margin-top: 1.5rem;">
        <button id="resend-otp-btn" class="btn btn-secondary" style="width: 100%; font-size: 0.9rem;" disabled>Resend OTP in 30s</button>
      </div>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;" class="text-muted">
        <a href="forgot-password.html" style="font-weight: 600;">← Back</a>
      </p>
    </div>
  </div>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script>
</body>
</html>
